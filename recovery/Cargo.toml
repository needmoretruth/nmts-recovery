[package]
name = "nmts-recovery"
version = "0.5.0"
edition = "2021"
rust-version = "1.75"
description = "Recover files uploaded with NMTS using only an account code, a recovery list, and a public Walrus aggregator. No NMTS server is contacted."
license = "AGPL-3.0-only"
publish = false

[[bin]]
name = "nmts-recovery"
path = "src/main.rs"

[dependencies]
# The NCF-3 engine. Path dependency here; in the published repository the two crates sit side by
# side in one workspace, so a stranger who clones it gets a build with nothing else to fetch.
#
# ⛔ THIS TOOL ADDS NO CRYPTOGRAPHY OF ITS OWN. Every key derivation, every envelope, every stream
#    decryption is a call into the same crate the browser compiles to WASM and the same conformance
#    vectors arbitrate. A recovery tool that reimplemented any of it would be a second opinion
#    nobody asked for, and the first place a mistake would hide.
nmts-crypto = { path = "../crypto" }

# The recovery list is JSON; so is the `.nmtsmap` wrapper around it.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SHA-256, to check a reassembled file against the hash the list recorded. Already in the tree —
# `nmts-crypto` uses it for HKDF — so this adds a name here and nothing to the dependency graph.
sha2 = "0.10"

# The one network dependency: a blocking HTTP client.
#
# ⚠ It is a dependency on a READ path and nothing else, and the account code never reaches it —
#   keys are derived locally. Two kinds of request cross the network: a public blob by its public
#   id (`source.rs`), and, with `--find` only, a question to a public Sui node about which blobs a
#   wallet owns (`discover.rs`). ⛔ This comment used to say the blob request was the only one; it
#   was written before `--find` existed and stayed wrong. The terminal help's WHAT GOES OUT block
#   is the copy a person actually reads, and a test holds it level with the code.
#   `--blobs-dir` skips this code entirely for anyone who would rather fetch the blobs themselves
#   with curl; `--print-fetch-plan` prints exactly what to fetch.
#
# `default-features = false` drops gzip: a blob is ciphertext, so there is nothing in it to
# compress, and a decompressor on this path would only add a way for a response to expand into
# more memory than the list said to expect. `rustls` brings its own bundled root certificates, so
# the tool does not depend on how the machine it is rescued onto happens to be configured.
#
# ⛔ @opens-sockets — this marker says the dependency on the NEXT LINE is the one that talks to
#   the network. It is read by the test in `src/args.rs` that holds the help's WHAT GOES OUT block
#   level with the code: to find the files that reach the network, that test searches the source
#   for the client crate's name, and the name used to be written into the test itself. A name
#   written in two places is a name that can be changed in one — swapping this crate, or importing
#   it here under another name, emptied that search without turning anything red. The name is
#   taken from this file now. Move the marker if the client crate changes; deleting it fails the
#   test rather than quieting it.
ureq = { version = "3", default-features = false, features = ["rustls"] }

# Clearing the account code out of memory when the value holding it goes away.
#
# ⛔ THE ENGINE CRATE ALREADY DOES THIS FOR ITS OWN TYPES — `AccountCode` and every key derived
#   from it clear themselves on drop. What was left uncovered was the TEXT on the way in: the line
#   read from the terminal, the contents of a `--code-file`, and the account code a recovery kit
#   carries in the clear. Those were ordinary `String`s, so the code stayed in freed heap memory,
#   where a core dump or a swapped-out page can outlive the run. `Zeroizing<String>` closes the
#   gap by type: a bare `String` no longer fits where the code is carried.
#
# ⚠ It adds nothing to the dependency graph — `nmts-crypto` already pulls this exact crate in.
zeroize = "1"

# Hiding what is typed at the account-code prompt, on all three desktop platforms.
#
# ⛔ This is here because the alternative was worse. Turning terminal echo off is a system call on
#   Unix and a console-mode change on Windows, and calling either directly from Rust means `unsafe`,
#   which this crate forbids. The version before this one shelled out to `stty`, which works on Unix
#   and does not exist on Windows — so a Windows user typed their account code onto a visible screen
#   while the program told them it was hidden. A small, widely-audited crate whose whole job is this
#   one thing is the honest way to keep that promise everywhere.
rpassword = "7"

# ── Turning a wallet seed into what a wallet app understands ─────────────────────────────────
#
# ⛔ These three are here because an account code derives a WALLET as well as file keys, and a
#   person recovering from a dead service needs both. The engine crate stops at the 32-byte seed
#   (that is where the frozen format stops); an address and an importable key are Sui's rules, not
#   ours, and are applied here.
#
# ⚠ Every one of them is checked against values produced by the library the product itself uses —
#   see the fixtures in `src/derive.rs`. A mismatch here would hand somebody the wrong address to
#   fund, or a key that is not theirs, and nothing else in this program would notice.
ed25519-dalek = { version = "2", default-features = false }
blake2 = { version = "0.10", default-features = false }
bech32 = { version = "0.11", default-features = false, features = ["alloc"] }

[dev-dependencies]
# The offline end-to-end test builds a synthetic account and serves blobs from a directory, so the
# whole restore path is exercised with no network at all.
tempfile = "3"
