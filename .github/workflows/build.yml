# Builds and tests on all three desktop platforms, on every push to main.
#
# WHY THIS EXISTS: this program's whole claim is that you can get your files back with it, on
# whatever machine you end up holding. "It builds and its tests pass on Linux, macOS and Windows"
# is worth more when GitHub says it than when the README does — and the tests are not smoke tests:
# they synthesise a real account, encrypt real files with the real engine, and restore them.
#
# ⛔ IT REACTS TO `push` AND TO `pull_request` — never to `pull_request_target`. That one word is
#    the whole security story: a `pull_request` run of a fork's branch gets a READ-ONLY token and
#    no secrets, and GitHub holds a first-time contributor's run until a maintainer approves it;
#    `pull_request_target` would run the same stranger's code WITH this repository's token. No
#    secrets are used here and none should ever be added. The publish gate refuses every
#    externally startable trigger — see deploy/lib/workflow-triggers.mjs in the source.
#
# ⚠ Outside code is merged here now, under the Contributor License Agreement. Accepting a patch
#    and running nothing on it would be worse than refusing patches.
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      # Every platform reports for itself. One failing does not hide the other two, and which ones
      # failed is the whole diagnostic.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Tests
        working-directory: recovery
        run: cargo test --verbose

      - name: Release build
        working-directory: recovery
        run: cargo build --release --verbose

      - name: It runs
        working-directory: recovery
        run: cargo run --release -- --version
