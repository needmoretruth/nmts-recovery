name: 질문 또는 의견 (한국어)
description: 어떻게 도는지 물으시거나, 이렇게 됐으면 한다고 말씀해 주십시오.
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        형식과 코드와 보장에 대한 질문은 여기가 맞습니다. 계정이나 돌고 있는 서비스에 대한 질문은
        https://nmts.me/ask 로 주시면 깃허브 계정 없이 운영자에게 닿습니다.

        영어로 쓰셔도 됩니다 — 둘 다 읽습니다.
  - type: textarea
    id: question
    attributes:
      label: 질문 또는 의견
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 무엇을 만들고 계신지 (관계있다면)
      description: 안 적으셔도 됩니다. 다만 답이 달라지는 경우가 많습니다.
